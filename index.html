<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#0E0E0E">
    <meta name="color-scheme" content="dark">
	<link rel="manifest" href="live-atlas/favicons/site.webmanifest">
	<link rel="icon" type="image/svg+xml" href="live-atlas/favicons/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="live-atlas/favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="live-atlas/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="live-atlas/favicons/apple-touch-icon.png">

    <meta name="keywords" content="minecraft, map, schalker, squaremap, карта" />
	<meta name="description" content="Живая карта мира сервера Schalker: постройки, территории и игроки онлайн." />
	<meta name="robots" content="noindex" />

    <title>Карта мира — Schalker</title>

    <script>
        window.liveAtlasConfig = {
            // Карта Schalker работает на squaremap.
            // Файлы LiveAtlas кладутся в веб-папку squaremap (plugins/squaremap/web) либо раздаются тем же
            // веб-сервером, что и тайлы squaremap. Значение — путь, по которому доступна папка с tiles/.
            servers: {
              schalker: {
                label: 'Schalker',
                squaremap: window.location.pathname
              },
            },

            // Другие варианты конфигурации (Dynmap, Pl3xmap, Overviewer, несколько серверов):
            // https://github.com/JLyne/LiveAtlas/wiki/Configuring-Multiple-Servers

            // Тексты интерфейса. Заголовки списков миров и игроков squaremap передаёт сам
            // (ui.sidebar.world_list_label и player_list_label в его настройках/локали).
            messages: {
                chatNoMessages: 'Сообщений в чате пока нет…',
                chatTitle: 'Чат',
                chatLogin: 'Войдите, чтобы писать в чат',
                chatSend: 'Отправить',
                chatPlaceholder: 'Напишите сообщение…',
                chatErrorUnknown: 'Не удалось отправить сообщение',
                chatErrorDisabled: 'Чат отключён',
                serversHeading: 'Серверы',
                markersHeading: 'Метки',
                markersSearchPlaceholder: 'Поиск меток…',
                markersSkeleton: 'В этом мире пока нет меток',
                markersSetSkeleton: 'В этом наборе нет меток',
                markersSearchSkeleton: 'Ничего не найдено',
                markersUnnamed: '(Без названия)',
                worldsSkeleton: 'Карты не настроены',
                playersSkeleton: 'Сейчас никого нет онлайн',
                playersTitle: 'Клик — показать игрока\nДвойной клик — следить за игроком',
                playersTitleHidden: 'Игрок сейчас скрыт с карты\nДвойной клик — следить, когда появится',
                playersTitleOtherWorld: 'Игрок в другом мире\nКлик — показать игрока\nДвойной клик — следить за игроком',
                playersSearchPlaceholder: 'Поиск игроков…',
                playersSearchSkeleton: 'Игроки не найдены',
                followingHeading: 'Слежение',
                followingUnfollow: 'Перестать следить',
                followingTitleUnfollow: 'Перестать следить за игроком',
                followingHidden: 'Сейчас скрыт',
                linkTitle: 'Скопировать ссылку на это место',
                loadingTitle: 'Загрузка…',
                locationRegion: 'Регион',
                locationChunk: 'Чанк',
                contextMenuCopyLink: 'Скопировать ссылку сюда',
                contextMenuCenterHere: 'Центрировать здесь',
                toggleTitle: 'Свернуть или развернуть раздел',
                mapTitle: 'Карта — стрелки на клавиатуре двигают карту',
                layersTitle: 'Слои',
                copyToClipboardSuccess: 'Скопировано',
                copyToClipboardError: 'Не удалось скопировать',

                loginTitle: 'Вход и регистрация',
                loginHeading: 'Уже есть аккаунт',
                loginUsernameLabel: 'Ник',
                loginPasswordLabel: 'Пароль',
                loginSubmit: 'Войти',
                loginErrorUnknown: 'Не удалось войти',
                loginErrorDisabled: 'Вход на этом сервере отключён',
                loginErrorIncorrect: 'Неверный ник или пароль',
                loginSuccess: 'Вы вошли',

                registerHeading: 'Новый аккаунт',
                registerDescription: `Введите ник, пароль и код регистрации.

                        Код можно получить в игре командой /dynmap webregister.`,
                registerConfirmPasswordLabel: 'Повторите пароль',
                registerCodeLabel: 'Код регистрации',
                registerSubmit: 'Зарегистрироваться',
                registerErrorUnknown: 'Не удалось зарегистрироваться',
                registerErrorDisabled: 'Регистрация на этом сервере отключена',
                registerErrorVerifyFailed: 'Пароли не совпадают',
                registerErrorIncorrect: 'Регистрация не удалась, проверьте введённые данные',

                logoutTitle: 'Выйти',
                logoutErrorUnknown: 'Не удалось выйти',
                logoutSuccess: 'Вы вышли',

                closeTitle: 'Закрыть',
                showMore: 'Показать ещё'
            },

            ui: {
            	// If true, player markers will always be displayed in front of other marker types
            	playersAboveMarkers: true,

                // Whether to enable the player list search box
                playersSearch: true,

                // Use more compact pre-2.0 player marker style
                compactPlayerMarkers: false,

                // Disable the map right click menu
                disableContextMenu: false,

                // Disable the markers button and list
                disableMarkerUI: false,

                // Custom URL to redirect to when logging in is required
                // This URL will need to handle the login process and redirect users back to LiveAtlas
                customLoginUrl: null,

                // Анимации интерфейса (Anime.js). При prefers-reduced-motion они отключаются автоматически.
                animations: true,

                // Откуда брать головы игроков. Сайт отдаёт их из скинов SkinsRestorer.
                // Подстановки: {uuid}, {name}, {size}. null — использовать heads-url из конфига squaremap.
                playerHeadsUrl: 'https://schalker.net/api/skins/head?uuid={uuid}&name={name}&size={size}',

                // Названия миров в списке. Ключ — идентификатор мира из squaremap (как в адресе карты,
                // через «:» или «_»). Миры без названия здесь получают его по типу: Обычный мир, Незер, Энд.
                worldNames: {
                    'minecraft:overworld': 'Обычный мир',
                    'minecraft:the_nether': 'Незер',
                    'minecraft:the_end': 'Энд',
                    'schalker:clanwar': 'Мир клановых войн',
                },
            },

            // Config version. Do not modify.
            version: 1
        };
    </script>

    <style>
        /* Цвета темы — те же токены, что на schalker.net */
        :root {
            --brand: #F44D89;
            --brand-soft: #FF67B3;
            --brand-light: #FFCDE1;
            --brand-glow: rgba(244, 77, 137, 0.35);

            --background-base: rgba(20, 20, 24, 0.86); /* Стеклянные панели и кнопки */
            --background-solid: #131217; /* Непрозрачная подложка (липкие заголовки) */
            --background-dark: #0E0E0E; /* Фон страницы и заставки */
            --background-light: #18181B; /* Поля ввода и полосы прокрутки */
            --background-error: rgba(239, 68, 68, 0.16); /* Ошибки */
            --background-marker: rgba(13, 11, 16, 0.86); /* Подписи меток на карте */

            --background-disabled: rgba(255, 255, 255, 0.04); /* Неактивные элементы */
            --background-hover: rgba(255, 255, 255, 0.06); /* :hover */
            --background-active: rgba(255, 255, 255, 0.1); /* :active */
            --background-selected: rgba(255, 255, 255, 0.08); /* Выбранные пункты */
            --background-panel: rgb(20, 20, 24); /* Боковые панели и их липкие заголовки */

            --glass-hover: rgba(36, 35, 42, 0.86); /* :hover отдельных стеклянных кнопок */
            --glass-active: rgba(46, 44, 53, 0.9); /* :active отдельных стеклянных кнопок */
            --glass-selected: rgba(46, 46, 54, 0.92); /* Нажатые отдельные кнопки */

            --outline-focus: rgba(244, 77, 137, 0.6); /* Обводка фокуса */

            --border-radius: 1.4rem;
            --border-radius-small: 1rem;
            --border-color: rgba(255, 255, 255, 0.1); /* Рамки панелей */
            --border-strong: #3F3F46;
            --border-error: #EF4444;
            --box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.9), 0 0 0 1px var(--border-color);
            --glass-filter: blur(20px) saturate(150%);

            --text-base: #D4D4D8; /* Обычный текст */
            --text-emphasis: #FFFFFF; /* Заголовки и сфокусированные поля */
            --text-subtle: #8B8B94; /* Подсказки и второстепенный текст */
            --text-disabled: #52525B; /* Неактивные элементы */
            --text-marker: #FFFFFF; /* Подписи меток на карте */

            --text-hover: #FFFFFF; /* Текст в :hover */
            --text-active: #FFFFFF; /* Текст в :active */
            --text-selected: #FFFFFF; /* Текст выбранных пунктов */
            --text-shadow: none;

            --text-night: #C4B5FD; /* Время ночью */
            --text-day: #F7C58B; /* Время днём */

            --state-ok: #10B981;
            --state-warn: #F59E0B;
            --state-danger: #EF4444;

            --font-body: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --font-heading: 'Noto Sans Variable', 'Noto Sans', var(--font-body);
            --font-pixel: Monocraft, ui-monospace, 'Cascadia Mono', Consolas, monospace;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes splash-loader {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        @keyframes splash-fallback {
            to {
                opacity: 1;
                transform: none;
            }
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #2B2B30 transparent;
        }

        *:hover, *:focus-within {
            scrollbar-color: #3A3A40 transparent;
        }

        *::-webkit-scrollbar {
            width: 0.6rem;
            height: 0.6rem;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            background-color: #2B2B30;
            border-radius: 2rem;
        }

        *:hover::-webkit-scrollbar-thumb, *:focus-within::-webkit-scrollbar-thumb {
            background-color: #3A3A40;
        }

        *::-webkit-scrollbar-button {
            display: none;
        }

        ::selection {
            background: rgba(255, 103, 179, 0.38);
        }

        html, body {
            background-color: var(--background-dark);
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
	        overscroll-behavior: none;
        }

        html {
            font-size: 62.5%;
            color-scheme: dark;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-base);
            text-shadow: var(--text-shadow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        noscript {
            color: var(--text-base);
            font-size: 1rem;
            font-family: sans-serif;
            text-align: center;
            line-height: 1.25;
        }

        #splash, noscript {
            position: fixed;
            inset: 0;
            z-index: 115; /* Над боковой панелью (110), под модальными окнами (120) */
            background-color: var(--background-dark);
            cursor: wait;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            padding: 4rem;
            overflow: hidden;
            transition: 0.3s opacity linear;
        }

        #splash[hidden] {
            display: none;
        }

        /* Раскрытие карты «диафрагмой» при скрытии заставки (переменную анимирует Anime.js) */
        #splash.splash--revealing {
            --reveal: 0%;
            transition: none;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--reveal), #000 calc(var(--reveal) + 6%));
            mask-image: radial-gradient(circle at 50% 50%, transparent var(--reveal), #000 calc(var(--reveal) + 6%));
        }

        /* Фон как .page-aurora на сайте: розово-синее свечение и сетка */
        .splash__aurora {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(52% 70% at 50% 38%, rgba(244, 77, 137, 0.16), transparent 68%),
                radial-gradient(46% 60% at 8% 0%, rgba(59, 130, 246, 0.08), transparent 72%),
                radial-gradient(42% 60% at 96% 100%, rgba(255, 103, 179, 0.08), transparent 74%);
        }

        .splash__aurora::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.45;
            background-image:
                linear-gradient(to right, rgba(63, 63, 70, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(63, 63, 70, 0.5) 1px, transparent 1px);
            background-size: 72px 72px;
            background-position: center;
            -webkit-mask-image: radial-gradient(48% 52% at 50% 45%, #000, transparent 76%);
            mask-image: radial-gradient(48% 52% at 50% 45%, #000, transparent 76%);
        }

        .splash__content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #splash__logo {
            width: 9.6rem;
            height: 9.6rem;
            overflow: visible;
            filter: drop-shadow(0 18px 40px rgba(244, 77, 137, 0.28));
        }

        .splash__title {
            margin-top: 2.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }

        .splash__name {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 4rem;
            letter-spacing: -0.02em;
            color: var(--brand);
        }

        .splash__tagline {
            margin-top: 0.8rem;
            font-size: 1.5rem;
            color: var(--brand-light);
        }

        /* До запуска скрипта блоки логотипа и подпись скрыты; если JS задерживается — показываются через CSS */
        #splash:not(.splash--animated) [data-block],
        #splash:not(.splash--animated) .splash__title > *,
        #splash:not(.splash--animated) #splash__spinner {
            opacity: 0;
            animation: splash-fallback 0.3s ease-out 1s forwards;
        }

        #splash [data-block] {
            transform-box: fill-box;
            transform-origin: center;
        }

        #splash__spinner {
            position: relative;
            margin-top: 3.2rem;
            width: 16rem;
            height: 0.3rem;
            border-radius: 1rem;
            background-color: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        #splash__spinner::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, var(--brand), var(--brand-soft), transparent);
            animation: splash-loader 1.3s cubic-bezier(.4, 0, .2, 1) infinite;
        }

        .splash__version {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            color: var(--text-subtle);
            font-family: var(--font-pixel);
            font-size: 1.2rem;
        }

        #splash__error {
            margin-top: 2.4rem;
            transition: opacity 0.5s ease-in;
            display: flex;
            flex-direction: column;
            text-align: center;
            max-width: 60rem;
            gap: 1rem;
        }

        #splash__error-message {
            font-family: var(--font-pixel);
            font-size: 1.3rem;
            line-height: 1.5;
            color: #FCA5A5;
            background-color: var(--background-error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 1.2rem 1.6rem;
            border-radius: var(--border-radius);
        }

        #splash__error-retry {
            color: var(--text-subtle);
            font-size: 1.3rem;
        }

        #splash__error[aria-hidden=true] {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            #splash:not(.splash--animated) [data-block],
            #splash:not(.splash--animated) .splash__title > *,
            #splash:not(.splash--animated) #splash__spinner {
                opacity: 1;
                animation: none;
            }

            #splash__spinner::after {
                animation-duration: 3s;
            }
        }

        #app {
            font-size: 1.6rem;
            height: 100%;
        }
    </style>
  </head>
  <body>
    <div id="splash">
        <div class="splash__aurora" aria-hidden="true"></div>

        <div class="splash__content">
            <svg id="splash__logo" viewBox="176 176 528 528" aria-hidden="true">
                <path data-block="arch" fill="#F44E8A" d="M201 255H679Q697 255 697 273V539Q697 549 687 549H588Q578 549 578 539V448Q578 420 550 420H330Q302 420 302 448V539Q302 549 292 549H193Q183 549 183 539V273Q183 255 201 255Z"/>
                <rect data-block="top" fill="#FD70A9" x="259" y="184" width="361" height="155" rx="18"/>
                <path data-block="base" fill="#F32A80" d="M206 589H673Q679 589 679 595V675Q679 697 657 697H222Q200 697 200 675V595Q200 589 206 589Z"/>
                <rect data-block="core" fill="#F6588F" x="342" y="460" width="195" height="168" rx="16"/>
            </svg>

            <div class="splash__title">
                <span class="splash__name">Schalker</span>
                <span class="splash__tagline">карта мира</span>
            </div>

            <div id="splash__spinner" role="progressbar" aria-label="Карта загружается"></div>

            <div id="splash__error" aria-hidden="true">
                <span id="splash__error-message" role="alert"></span>
                <span id="splash__error-retry" aria-live="polite"></span>
            </div>
        </div>

        <span class="splash__version" aria-hidden="true"></span>
    </div>

    <noscript>
        <strong>Для работы карты нужен JavaScript.<br />Включите его, чтобы продолжить.</strong>
    </noscript>

    <main id="app" aria-hidden="true"></main>
    <script type="module" src="/src/main.ts"></script>

    <script>
        window.addEventListener('load', () => {
            if(!window.liveAtlasLoaded) {
                document.getElementById('splash__error').setAttribute('aria-hidden', 'false');
                document.getElementById('splash__error-message').innerText = 'Файлы карты отсутствуют или не загрузились.\nПереустановите LiveAtlas.';
                document.getElementById('splash__spinner').style.visibility = 'hidden';
            }
        });
    </script>
  </body>
</html>
